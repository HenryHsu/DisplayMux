name: Signed desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: displaymux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - label: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - label: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "const fs=require('fs');const app=require('./src-tauri/tauri.conf.json').version;const pkg=require('./package.json').version;const cargo=fs.readFileSync('./src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m)?.[1];if(process.env.GITHUB_REF_NAME!=='v'+app||pkg!==app||cargo!==app){throw new Error('Tag, Tauri, package.json and Cargo.toml versions must match')}"

      - name: Test frontend
        run: pnpm build

      - name: Test Rust workspace
        run: cargo test --locked --all-targets

      - name: Build signed draft release
        uses: tauri-apps/tauri-action@2d793bf2c8c505b9b76211601b09aab48922225d # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: v__VERSION__
          releaseName: DisplayMux v__VERSION__
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
